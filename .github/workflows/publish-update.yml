name: Publish update metadata
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: update-metadata
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Validate release and generate immutable metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/publish_update.py --tag "$RELEASE_TAG" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt2" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Commit pointer and manifest atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified update metadata'
          git pull --rebase origin main
          git push origin HEAD:main
